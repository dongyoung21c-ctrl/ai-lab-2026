<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 스튜디오 · 안티그래비티 실습실</title>
<meta name="description" content="2026 AI·디지털지식나눔교사 3~4차시 구글 AI 스튜디오 · 안티그래비티 실습 웹앱 · 비산초등학교 신동영">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='10' r='6' fill='%234285F4'/%3E%3Ccircle cx='22' cy='10' r='6' fill='%23EA4335'/%3E%3Ccircle cx='10' cy='22' r='6' fill='%23FBBC04'/%3E%3Ccircle cx='22' cy='22' r='6' fill='%2334A853'/%3E%3C/svg%3E">
<style>
  :root {
    --blue: #1a73e8; --blue-soft: #e8f0fe; --blue-ink: #174ea6;
    --green: #188038; --green-soft: #e6f4ea;
    --yellow: #b06000; --yellow-soft: #fef7e0;
    --red: #c5221f; --red-soft: #fce8e6;
    --ink: #1f2430; --ink-2: #3c4350; --muted: #667085; --line: #e4e7ec;
    --bg: #f5f7fa; --card: #ffffff; --code-bg: #0d1117;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --font: 'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif;
    --mono: 'D2Coding', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--mono); font-size: .88em; background: #eef1f5; color: #b3261e; padding: .1em .38em; border-radius: 5px; }
  h1, h2, h3, h4 { line-height: 1.3; margin: 0; letter-spacing: -.01em; }
  button { font-family: inherit; }

  /* ── header ── */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 20px; padding: 0 20px; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; color: var(--ink); }
  .brand:hover { text-decoration: none; }
  .dots { display: grid; grid-template-columns: 9px 9px; gap: 3px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #4285f4; } .dots i:nth-child(2) { background: #ea4335; }
  .dots i:nth-child(3) { background: #fbbc04; } .dots i:nth-child(4) { background: #34a853; }
  .brand b { font-size: 16px; display: block; line-height: 1.2; }
  .brand small { font-size: 11.5px; color: var(--muted); display: block; line-height: 1.2; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { white-space: nowrap; padding: 8px 13px; border-radius: 999px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; }
  nav.tabs a:hover { background: #f0f2f5; text-decoration: none; }
  nav.tabs a.active { background: var(--blue-soft); color: var(--blue-ink); }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ── common blocks ── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 24px; }
  .section { margin-top: 36px; scroll-margin-top: 80px; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .section-head h2 { font-size: 21px; }
  .section-head p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .kicker { font-size: 13px; font-weight: 700; color: var(--blue); letter-spacing: .02em; }
  .muted { color: var(--muted); }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #f0f2f5; color: var(--ink-2); }
  .b-blue { background: var(--blue-soft); color: var(--blue-ink); }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-yellow { background: var(--yellow-soft); color: var(--yellow); }
  .b-red { background: var(--red-soft); color: var(--red); }
  .btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 9px 15px; border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { background: #f5f7fa; text-decoration: none; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1765cc; }
  .btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn .ico { font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f8f9fb; font-weight: 700; color: var(--ink-2); font-size: 13.5px; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .callout { border-radius: 12px; padding: 14px 16px; font-size: 15px; display: flex; gap: 10px; }
  .callout.info { background: var(--blue-soft); color: #1d3b6e; }
  .callout.ok { background: var(--green-soft); color: #14532d; }
  .callout.warn { background: var(--yellow-soft); color: #6b3d00; }
  .callout .ci { flex-shrink: 0; }
  ul.clean, ol.clean { margin: 0; padding-left: 20px; }
  ul.clean li, ol.clean li { margin: 4px 0; }

  /* ── home ── */
  .hero { padding: 34px 32px; position: relative; overflow: hidden; }
  .hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(66,133,244,.12), transparent 70%); }
  .hero h1 { font-size: 32px; margin: 8px 0 10px; }
  .hero p.lead { margin: 0; color: var(--ink-2); font-size: 16.5px; max-width: 720px; }
  .hero .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 20px; }
  .hero .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .session { padding: 20px 22px; }
  .session-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .session h3 { font-size: 17px; margin-bottom: 10px; }
  .session ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .session li { counter-increment: s; position: relative; padding: 9px 10px 9px 38px; border-radius: 10px; }
  .session li::before { content: counter(s); position: absolute; left: 8px; top: 9px; width: 22px; height: 22px; border-radius: 50%; background: #f0f2f5; font-size: 12.5px; font-weight: 700; display: grid; place-items: center; color: var(--ink-2); }
  .session li a { color: var(--ink); display: block; }
  .session li:hover { background: #f5f7fa; }
  .session li:hover a { text-decoration: none; color: var(--blue-ink); }
  .quick a { display: block; padding: 14px 16px; color: var(--ink); }
  .quick a:hover { text-decoration: none; border-color: #c7d7f5; background: #fafcff; }
  .quick b { display: block; font-size: 15px; }
  .quick small { color: var(--muted); font-size: 13px; }
  .concept-card { padding: 20px 22px; }
  .concept-card h3 { font-size: 17px; margin: 8px 0 8px; }
  .concept-card p { margin: 0 0 10px; color: var(--ink-2); font-size: 15px; }
  .steps-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14.5px; }
  .steps-inline span { background: #fff; border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .steps-inline em { font-style: normal; color: var(--muted); }
  details.faq { border-bottom: 1px solid var(--line); }
  details.faq:last-child { border-bottom: none; }
  details.faq summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style: none; display: flex; gap: 10px; }
  details.faq summary::-webkit-details-marker { display: none; }
  details.faq summary::before { content: '＋'; color: var(--blue); font-weight: 700; }
  details.faq[open] summary::before { content: '－'; }
  details.faq .ans { padding: 0 18px 16px 44px; color: var(--ink-2); font-size: 15px; }

  /* ── lab layout ── */
  .lab-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; }
  .lab-side { position: sticky; top: 82px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 14px; }
  .lab-side .room { padding: 6px 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .lab-side .room b { font-size: 16px; display: block; }
  .lab-side .room small { color: var(--muted); font-size: 13px; }
  .lab-side .room-go { width: 100%; justify-content: center; margin-top: 12px; }
  .side-group { margin: 12px 0 4px; padding: 0 8px; }
  .side-group b { font-size: 12.5px; color: var(--blue); letter-spacing: .03em; }
  .side-group span { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-left: 4px; }
  .side-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); font-size: 14.5px; font-weight: 500; }
  .side-item:hover { background: #f5f7fa; text-decoration: none; }
  .side-item.active { background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; }
  .side-item .chk { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c9ced6; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; color: #fff; }
  .side-item.done .chk { background: var(--green); border-color: var(--green); }
  .side-item.done .chk::after { content: '✓'; }
  .progress { margin: 4px 8px 10px; height: 6px; background: #eef1f5; border-radius: 999px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .3s; }
  .side-select { display: none; width: 100%; padding: 11px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; background: #fff; }

  .lab { padding: 28px 30px; }
  .lab-head .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .lab-head h2 { font-size: 26px; }
  .lab-head p { margin: 8px 0 0; color: var(--ink-2); font-size: 16px; }
  .lab-head .row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .done-toggle { flex-shrink: 0; }
  .done-toggle.on { background: var(--green-soft); border-color: #b7dfc3; color: var(--green); }
  .link-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .link-row .btn.k-copy { background: var(--green); border-color: var(--green); color: #fff; }
  .link-row .btn.k-copy:hover { background: #137333; }
  .lab-block { margin-top: 28px; }
  .lab-block h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lab-block h3 .num { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: #fff; font-size: 13px; display: grid; place-items: center; }
  .concepts li { margin: 6px 0; }
  ol.follow { list-style: none; padding: 0; margin: 0; counter-reset: f; }
  ol.follow li { counter-increment: f; position: relative; padding: 10px 0 10px 40px; border-bottom: 1px dashed var(--line); }
  ol.follow li:last-child { border-bottom: none; }
  ol.follow li::before { content: counter(f); position: absolute; left: 0; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; font-size: 13.5px; display: grid; place-items: center; }
  .prompt-box { background: #fbfaf6; border: 1px solid #ece6d3; border-radius: 12px; overflow: hidden; }
  .box-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #ece6d3; background: #f7f3e6; }
  .box-bar .t { font-size: 13px; font-weight: 700; color: #6b5a1e; margin-right: auto; }
  .prompt-box pre { margin: 0; padding: 16px 18px; white-space: pre-wrap; font-family: var(--font); font-size: 14.5px; line-height: 1.7; color: var(--ink); max-height: 360px; overflow: auto; }
  .code-box { border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid #1f2733; }
  .code-tabs { display: flex; align-items: center; gap: 2px; padding: 6px 8px; background: #161b22; border-bottom: 1px solid #262c36; }
  .code-tabs button.tab { background: transparent; border: 0; color: #9aa4b2; font-family: var(--mono); font-size: 13px; padding: 7px 12px; border-radius: 7px; cursor: pointer; }
  .code-tabs button.tab.active { background: #2b3340; color: #fff; }
  .code-tabs .spacer { flex: 1; }
  .code-tabs .lines { color: #6e7681; font-size: 12px; margin-right: 6px; }
  .btn.dark { background: #2b3340; border-color: #3a4352; color: #e6edf3; }
  .btn.dark:hover { background: #3a4352; }
  .code-box pre { margin: 0; max-height: 520px; overflow: auto; }
  .code-box pre code { display: block; padding: 16px 18px; background: transparent; color: #e6edf3; font-size: 13.5px; line-height: 1.6; border-radius: 0; white-space: pre; }
  .code-note { margin-bottom: 10px; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
  .pager a { max-width: 48%; }
  .pager small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }

  /* ── examples ── */
  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .ex-card { display: flex; flex-direction: column; padding: 16px; color: var(--ink); min-height: 96px; }
  .ex-card:hover { text-decoration: none; border-color: #c7d7f5; background: #fafcff; }
  .ex-card b { font-size: 15.5px; }
  .ex-card small { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ex-card .go { margin-top: auto; padding-top: 10px; font-size: 12.5px; color: var(--blue); font-weight: 700; }

  /* ── share ── */
  .share-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 22px; align-items: start; }
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--ink-2); }
  .form-field input, .form-field select, .form-field textarea, .search { width: 100%; padding: 11px 12px; font-size: 15px; font-family: inherit; border: 1px solid #d0d5dd; border-radius: 10px; background: #fff; color: var(--ink); }
  .form-field textarea { resize: vertical; min-height: 76px; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus, .search:focus { outline: 2px solid rgba(26,115,232,.25); border-color: var(--blue); }
  .form-msg { font-size: 14px; font-weight: 600; min-height: 20px; margin-top: 10px; }
  .form-msg.err { color: var(--red); } .form-msg.ok { color: var(--green); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .share-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .share-tools .search { max-width: 260px; }
  .share-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .share-card h4 { font-size: 16px; }
  .share-card p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
  .share-card .who { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .share-card .btn { align-self: flex-start; margin-top: 6px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }

  footer { border-top: 1px solid var(--line); background: #fff; }
  footer .inner { max-width: 1200px; margin: 0 auto; padding: 22px 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  footer b { color: var(--ink-2); }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #1f2430; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14.5px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 960px) {
    .lab-layout, .share-layout { grid-template-columns: minmax(0, 1fr); }
    .lab-side { position: static; max-height: none; }
    .lab-side .side-list { display: none; }
    .side-select { display: block; }
    .g3 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    main { padding: 18px 16px 48px; }
    .topbar-inner { padding: 0 12px; gap: 10px; height: auto; min-height: 56px; flex-wrap: wrap; padding-top: 8px; }
    .brand small { display: none; }
    nav.tabs { margin-left: 0; width: 100%; padding-bottom: 8px; }
    .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
    .hero { padding: 24px 20px; }
    .hero h1 { font-size: 25px; }
    .lab { padding: 20px 18px; }
    .lab-head h2 { font-size: 22px; }
    .lab-head .row { flex-direction: column; }
    .pad { padding: 18px; }
    th, td { padding: 10px; }
  }

  /* ── 3~4차시 전용 색 (1~2차시와 구분) ── */
  :root { --blue: #5148e5; --blue-soft: #eeedfd; --blue-ink: #3a32b8; }
  .btn.primary:hover { background: #4239d4; }

  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 2px; }
  .flow span { background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; font-size: 14px; padding: 7px 13px; border-radius: 999px; }
  .flow i { font-style: normal; color: var(--muted); }
  .ex-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .ex-mini div { border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: #fcfcff; }
  .ex-mini b { display: block; font-size: 15px; }
  .ex-mini small { color: var(--blue-ink); font-weight: 700; font-size: 12.5px; }
  .ex-mini p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .chips.static .chip { cursor: default; }
  .snippet { background: #f6f7fb; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .snippet pre { margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; color: var(--ink); }
  .snippet .box-bar { background: #eef0f6; border-bottom: 1px solid var(--line); }
  .snippet .box-bar .t { color: var(--ink-2); }
  .prompt-box + .prompt-box, .snippet + .snippet { margin-top: 12px; }

  /* 프롬프트 도우미 */
  .builder { border: 2px solid var(--blue-soft); border-radius: 14px; padding: 18px; background: #fbfbff; }
  .builder h4 { margin: 0 0 4px; font-size: 16px; }
  .builder > p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .b-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
  .b-grid .full { grid-column: 1 / -1; }
  .b-field label, .b-field .lbl { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; }
  .b-field input, .b-field select, .b-field textarea { width: 100%; padding: 10px 11px; font-size: 15px; font-family: inherit; border: 1px solid #d0d5dd; border-radius: 9px; background: #fff; color: var(--ink); }
  .b-field textarea { min-height: 70px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; padding: 6px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin: 0; }
  .checks input { width: auto; margin: 0; }
  .checks label:has(input:checked) { background: var(--blue-soft); border-color: #c9c6f7; color: var(--blue-ink); }
  .b-out { margin-top: 14px; }

  /* 홈 체크리스트 · 용어 */
  .check-list { list-style: none; margin: 0; padding: 0; }

<script>
(function () {
  'use strict';
  const D = window.APP_DATA;
  const $ = (sel, root) => (root || document).querySelector(sel);

  /* ── helpers ── */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const ext = url => `href="${esc(url)}" target="_blank" rel="noopener noreferrer"`;

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copyText(text, label) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast((label || '내용') + '을(를) 복사했습니다');
  }

  const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장 불가 환경 */ } }
  };
  let doneSet = new Set(store.get('ai-lab-done', []));
  const saveDone = () => store.set('ai-lab-done', [...doneSet]);
  const levelBadge = lv => ({ '쉬움': 'b-green', '보통': 'b-blue', '도전': 'b-red' }[lv] || '');

  const promptBox = (title, text, idx) => `
    <div class="prompt-box">

    return `

        <h4>🧩 프롬프트 도우미</h4>
        <p>고르고 적기만 하면 Build에 붙여 넣을 요청문이 만들어집니다.</p>
        <div class="b-grid">
          <div class="b-field"><label for="pb-grade">학년</label>${sel('pb-grade', BUILDER.grades)}</div>
          <div class="b-field"><label for="pb-subject">교과</label>${sel('pb-subject', BUILDER.subjects)}</div>
          <div class="b-field full"><label for="pb-topic">단원 · 주제</label><input id="pb-topic" placeholder="예: 분수의 덧셈, 달의 모양 변화, 우리 고장의 문화유산"></div>
          <div class="b-field"><label for="pb-type">앱 종류</label>${sel('pb-type', BUILDER.types)}</div>
          <div class="b-field"><label for="pb-mood">디자인 분위기</label>${sel('pb-mood', BUILDER.moods)}</div>
          <div class="b-field full"><span class="lbl">꼭 넣을 기능</span>
            <div class="checks" id="pb-features">${BUILDER.features.map((f, i) => `<label><input type="checkbox" value="${esc(f)}" ${i < 2 ? 'checked' : ''}>${esc(f)}</label>`).join('')}</div>
          </div>
          <div class="b-field full"><label for="pb-extra">더 하고 싶은 말 (선택)</label><textarea id="pb-extra" placeholder="예: 모둠별로 한 대의 태블릿을 같이 써요. 문제는 10개면 충분해요."></textarea></div>
        </div>
        <div class="plan-actions"><button class="btn primary" id="pb-make">요청문 만들기</button></div>
        <div class="b-out" id="pb-out"></div>
      </div>`;
  }

  function buildPrompt() {
    const v = id => $('#' + id).value.trim();
    const topic = v('pb-topic') || '(단원 · 주제)';
    const feats = [...document.querySelectorAll('#pb-features input:checked')].map(i => i.value);
    const usesAI = feats.some(f => f.startsWith('AI'));
    const lines = [
      `[역할] 너는 ${v('pb-subject')} 수업을 돕는 교육용 웹앱 기획자이자 개발자야.`,
      '',
      `[목표] ${v('pb-grade')} 학생이 '${topic}'을(를) 스스로 조작하며 이해할 수 있는 '${v('pb-type')}' 웹앱을 만들어 줘.`,
      '',
      `[맥락] 교실에서 태블릿과 전자칠판으로 사용해. 수업 한 차시(40분) 안에서 10~15분 활동으로 쓸 거야.`,
      v('pb-extra') ? v('pb-extra') : null,
      '',
      '[화면 구성]',
      '1. 시작 화면: 앱 제목, 오늘 배울 내용 한 줄, [시작] 버튼',
      `2. 활동 화면: '${topic}' 핵심 개념을 직접 눌러 보고 바꿔 보는 활동`,
      '3. 마무리 화면: 배운 점 정리와 다시 하기 버튼',
      '',
      '[꼭 넣을 기능]',
      ...(feats.length ? feats.map(f => '- ' + f) : ['- (기본 기능만)']),
      '',
      '[디자인]',
      `- ${v('pb-mood')} 분위기, ${v('pb-grade')} 눈높이에 맞는 쉬운 말`,
      '- 버튼과 글씨는 크게, 태블릿 · 휴대폰 화면에서도 깨지지 않게',
      '',
      '[지켜야 할 것]',
      '- 학생 이름 · 연락처 같은 개인정보는 받거나 저장하지 않기',
      usesAI ? '- AI 답변은 3문장 이내, 학년 수준 어휘로. 부적절한 입력은 정중히 다시 쓰게 안내하기' : null,
      '- 오류가 없도록 모든 버튼이 실제로 동작하는지 스스로 점검하기',
      '',
      '[완료 기준] 시작 → 활동 → 마무리까지 끊김 없이 이어지고, 위 기능이 모두 동작하면 완성이야.'
    ];
    return lines.filter(l => l !== null).join('\n');
  }

  function bindBuilder(view) {
    const make = $('#pb-make', view);
    if (!make) return;
    make.addEventListener('click', () => {
      const text = buildPrompt();
      $('#pb-out', view).innerHTML = `
        <div class="prompt-box">
          <div class="box-bar"><span class="t">완성된 요청문</span>
            <a class="btn sm" ${ext('https://aistudio.google.com/apps')}>Build 열기 ↗</a>
            <button class="btn sm" id="pb-copy">복사</button></div>
          <pre>${esc(text)}</pre>
        </div>`;
      $('#pb-copy', view).addEventListener('click', () => copyText(text, '요청문'));
    });
  }

  /* ── LAB ROOMS ── */
  const ROOMS = {
    studio: { title: 'AI 스튜디오 실습실', desc: '3차시 · 웹에서 바로 만드는 교과 맞춤 웹앱', labs: D.studio, groups: D.studioGroups,
      shortcut: { label: 'AI 스튜디오 열기', url: 'https://aistudio.google.com/' }, next: { label: '4차시 안티그래비티로 →', href: '#agy' } },
    agy: { title: '안티그래비티 실습실', desc: '4차시 · 내 PC에서 에이전트와 함께 키우기', labs: D.agy, groups: D.agyGroups,
      shortcut: { label: 'Antigravity 다운로드', url: 'https://antigravity.google/' }, next: { label: '적용 계획 세우기 →', href: '#plan' } }
  };

  function renderRoom(roomKey, labId) {
    const room = ROOMS[roomKey];
    const labs = room.labs;
    const lab = labs.find(l => l.id === labId) || labs[0];
    const idx = labs.indexOf(lab);
    const doneCount = labs.filter(l => doneSet.has(l.id)).length;
    const group = room.groups.find(g => g.id === lab.group);

    const sideItem = l => `<a class="side-item ${l.id === lab.id ? 'active' : ''} ${doneSet.has(l.id) ? 'done' : ''}" href="#${roomKey}/${l.id}"><span class="chk"></span><span>${esc(l.title)}</span></a>`;
    const sideList = room.groups.map(g => `<div class="side-group"><b>${esc(g.label)}</b><span>${esc(g.title)}</span></div>${labs.filter(l => l.group === g.id).map(sideItem).join('')}`).join('');
    const options = labs.map(l => `<option value="${esc(l.id)}" ${l.id === lab.id ? 'selected' : ''}>${esc(l.title)}${doneSet.has(l.id) ? ' ✓' : ''}</option>`).join('');
    const links = (lab.links || []).map(k => `<a class="btn" ${ext(k.url)}>${esc(k.label)} ↗</a>`).join('');

    // 복사 버튼에서 꺼내 쓸 텍스트 목록
    const copies = [];
    const addCopy = (label, text) => { copies.push({ label, text }); return copies.length - 1; };

    let n = 0;
    const block = (title, inner) => `<div class="lab-block"><h3><span class="num">${++n}</span>${title}</h3>${inner}</div>`;
    let html = '';
    if (lab.flow) html += block('흐름 한눈에', flowHtml(lab.flow));
    if (lab.concepts) html += block('핵심 개념', `<ul class="clean concepts">${lab.concepts.map(c => `<li>${fmt(c)}</li>`).join('')}</ul>`);
    if (lab.table) html += block('정리 표', tableHtml(lab.table));
    if (lab.steps) html += block('따라 하기', `<ol class="follow">${lab.steps.map(s => `<li>${fmt(s)}</li>`).join('')}</ol>`);
    if (lab.builder) html += block('프롬프트 도우미', builderHtml());
    if (lab.examples) html += block('이런 앱을 만들어 볼 수 있어요', `<div class="ex-mini">${lab.examples.map(e => `<div><small>${esc(e.subject)}</small><b>${esc(e.title)}</b><p>${esc(e.desc)}</p></div>`).join('')}</div>`);
    if (lab.prompts) html += block('프롬프트', lab.prompts.map(p => promptBox(p.title, p.text, addCopy(p.title, p.text))).join(''));
    if (lab.ideas) html += block('추가해 볼 기능 아이디어', `<div class="chips static">${lab.ideas.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div>`);
    if (lab.snippets) html += block('복사해서 쓰기', lab.snippets.map(s => `
      <div class="snippet"><div class="box-bar"><span class="t">${esc(s.name)}</span><button class="btn sm" data-copy="${addCopy(s.name, s.text)}">복사</button></div><pre>${esc(s.text)}</pre></div>`).join(''));
    if (lab.result) html += block('실행 결과', `<div class="callout ok"><span class="ci">🎯</span><span>${fmt(lab.result)}</span></div>`);
    if (lab.tips && lab.tips.length) html += block('알아 두기', `<ul class="clean">${lab.tips.map(t => `<li>${fmt(t)}</li>`).join('')}</ul>`);

    const prev = labs[idx - 1], next = labs[idx + 1];
    const isDone = doneSet.has(lab.id);

    $('#view-' + roomKey).innerHTML = `
      <div class="lab-layout">
        <aside class="card lab-side">
          <div class="room"><b>${esc(room.title)}</b><small>${esc(room.desc)}</small>
            <a class="btn primary room-go" ${ext(room.shortcut.url)}>${esc(room.shortcut.label)} ↗</a></div>
          <div class="progress" title="완료 ${doneCount}/${labs.length}"><i style="width:${Math.round(doneCount / labs.length * 100)}%"></i></div>
          <select class="side-select" aria-label="실습 선택">${options}</select>
          <div class="side-list">${sideList}</div>
        </aside>
        <article class="card lab">
          <div class="lab-head">
            <div class="row">
              <div>
                <div class="badges">
                  ${group ? `<span class="badge b-yellow">${esc(group.label)} · ${esc(group.title)}</span>` : ''}
                  <span class="badge">${esc(lab.tag)}</span>
                  <span class="badge ${levelBadge(lab.level)}">${esc(lab.level)}</span>
                  <span class="badge">⏱ ${esc(lab.time)}</span>
                </div>
                <h2>${esc(lab.title)}</h2>
                <p>${fmt(lab.summary)}</p>
              </div>
              <button class="btn done-toggle ${isDone ? 'on' : ''}" data-done>${isDone ? '✓ 완료함' : '완료 표시'}</button>
            </div>
            ${links ? `<div class="link-row">${links}</div>` : ''}
          </div>
          ${html}
          <div class="pager">
            ${prev ? `<a class="btn" href="#${roomKey}/${prev.id}"><span><small>이전</small>← ${esc(prev.title)}</span></a>` : '<span></span>'}
            ${next ? `<a class="btn" href="#${roomKey}/${next.id}" style="text-align:right"><span><small>다음</small>${esc(next.title)} →</span></a>` : `<a class="btn primary" href="${room.next.href}">${esc(room.next.label)}</a>`}
          </div>
        </article>
      </div>`;

    const view = $('#view-' + roomKey);
    $('.side-select', view).addEventListener('change', e => { location.hash = roomKey + '/' + e.target.value; });
    $('[data-done]', view).addEventListener('click', () => {
      if (doneSet.has(lab.id)) doneSet.delete(lab.id); else doneSet.add(lab.id);
      saveDone();
      renderRoom(roomKey, lab.id);
    });
    view.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
      const c = copies[Number(b.dataset.copy)];
      copyText(c.text, c.label);
    }));
    bindBuilder(view);
  }

  /* ── COMPARE ── */
  function renderCompare() {
    const C = D.compare;
    $('#view-compare').innerHTML = `
      <div class="section-head" style="margin-top:4px"><h2 style="font-size:26px">비교 · 선택</h2><p>3차시와 4차시 도구는 경쟁 관계가 아니라 이어지는 단계입니다.</p></div>
      <div class="ladder">${C.ladder.map(l => `<div><em>STEP ${esc(l.step)}</em><b>${esc(l.name)}</b><p>${esc(l.desc)}</p></div>`).join('')}</div>

      <div class="section">
        <div class="section-head"><h2>AI 스튜디오 vs 안티그래비티</h2></div>
        <div class="table-wrap"><table>
          <tr><th style="width:18%">구분</th><th>AI 스튜디오 (3차시)</th><th>안티그래비티 (4차시)</th></tr>
          ${C.rows.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}
        </table></div>
      </div>

      <div class="section">
        <div class="section-head"><h2>내 아이디어엔 무엇이 맞을까?</h2><p>네 가지 질문에 답해 보세요.</p></div>
        <div class="card pad">
          ${C.quiz.map((q, i) => `<div class="quiz-q"><span>${i + 1}. ${esc(q.q)}</span><div class="yn" data-q="${i}"><button data-a="yes">예</button><button data-a="no">아니오</button></div></div>`).join('')}
          <div class="quiz-result" id="quiz-result"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2>함께 생각해 보기</h2></div>
        <div class="card pad"><ul class="clean">
          <li>같은 앱을 AI 스튜디오에서 고칠 때와 안티그래비티에서 고칠 때, 무엇이 더 편하고 무엇이 더 불편했나요?</li>
          <li>에이전트가 세운 구현 계획을 검토할 때 교사가 꼭 확인해야 할 것은 무엇일까요?</li>
          <li>우리 학교에서 두 도구를 쓸 때 지켜야 할 약속(개인정보 · 공개 범위 · 비용)은 무엇일까요?</li>
        </ul></div>
      </div>`;

    const answers = {};
    $('#view-compare').addEventListener('click', e => {
      const b = e.target.closest('.yn button');
      if (!b) return;
      const box = b.parentElement;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      answers[box.dataset.q] = b.dataset.a;
      const keys = Object.keys(answers);
      if (keys.length < C.quiz.length) { $('#quiz-result').innerHTML = ''; return; }
      let studio = 0, agy = 0;
      keys.forEach(k => { const pick = C.quiz[k][answers[k]]; if (pick === 'studio') studio++; else agy++; });
      const both = Math.abs(studio - agy) <= 0;
      const msg = both
        ? ['🔀', 'AI 스튜디오로 빠르게 시작하고, 기능이 늘어나면 안티그래비티로 옮겨 키우는 방법을 추천합니다.', 'studio']
        : studio > agy
          ? ['🌐', 'AI 스튜디오가 잘 맞아요. 설치 없이 Build로 만들고 공유 링크로 바로 나눠 보세요.', 'studio']
          : ['🧑‍💻', '안티그래비티가 잘 맞아요. 폴더를 만들고 계획부터 세우게 한 뒤 MCP로 도구를 연결해 보세요.', 'agy'];
      $('#quiz-result').innerHTML = `<div class="callout info"><span class="ci">${msg[0]}</span><span>${esc(msg[1])} <a href="#${msg[2]}">실습실로 이동 →</a></span></div>`;
    });
  }

  /* ── PLAN ── */
  function renderPlan() {
    const P = D.plan;
    const saved = store.get('ai-lab-plan', {});
    const opt = (list, cur) => list.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
    $('#view-plan').innerHTML = `
      <div class="section-head" style="margin-top:4px"><h2 style="font-size:26px">우리 학교 적용 계획</h2><p>오늘 만든 도구를 실제로 어디에 쓸지 한 장으로 정리합니다. 입력 내용은 이 기기에만 저장됩니다.</p></div>
      <div class="plan-layout">
        <div class="card pad plan-form">
          <div class="b-grid">
            <div class="b-field full"><label for="pl-title">도구 이름</label><input id="pl-title" value="${esc(saved.title || '')}" placeholder="예: 분수 피자 가게"></div>
            <div class="b-field full"><label for="pl-problem">해결하고 싶은 문제</label><textarea id="pl-problem" placeholder="예: 분수 덧셈을 어려워하는 학생이 많고 연습 자료가 부족하다">${esc(saved.problem || '')}</textarea></div>
            <div class="b-field"><label for="pl-user">누가 쓰나요?</label><select id="pl-user">${opt(P.users, saved.user)}</select></div>
            <div class="b-field"><label for="pl-tool">어떤 도구로?</label><select id="pl-tool">${opt(P.tools, saved.tool)}</select></div>
            <div class="b-field full"><label for="pl-features">핵심 기능 (한 줄에 하나)</label><textarea id="pl-features" placeholder="문제 10개 랜덤 출제&#10;틀린 문제 다시 풀기&#10;결과 카드 저장">${esc(saved.features || '')}</textarea></div>
            <div class="b-field"><label for="pl-when">언제 쓸까요?</label><select id="pl-when">${opt(P.when, saved.when)}</select></div>
            <div class="b-field"><label for="pl-share">누구와 나눌까요?</label><input id="pl-share" value="${esc(saved.share || '')}" placeholder="예: 동학년 선생님들"></div>
            <div class="b-field full"><span class="lbl">개인정보 · 안전 점검</span>
              <div class="checks" id="pl-privacy" style="flex-direction:column;align-items:flex-start">${P.privacy.map((p, i) => `<label><input type="checkbox" value="${i}" ${(saved.privacy || []).includes(i) ? 'checked' : ''}>${esc(p)}</label>`).join('')}</div>
            </div>
          </div>
        </div>
        <div>
          <div class="card plan-card" id="plan-card"></div>
          <div class="plan-actions no-print">
            <button class="btn primary" id="pl-print">인쇄 · PDF 저장</button>
            <button class="btn" id="pl-copy">에이전트용 요청문 복사</button>
            <a class="btn" href="#share">작품 공유하러 가기</a>
          </div>
        </div>
      </div>`;

    const view = $('#view-plan');

      title: $('#pl-title').value.trim(), problem: $('#pl-problem').value.trim(),
      user: $('#pl-user').value, tool: $('#pl-tool').value,
      features: $('#pl-features').value.trim(), when: $('#pl-when').value, share: $('#pl-share').value.trim(),
      privacy: [...document.querySelectorAll('#pl-privacy input:checked')].map(i => Number(i.value))
    });
    const draw = () => {
      const p = read();
      store.set('ai-lab-plan', p);
      const feats = p.features ? p.features.split('\n').map(s => s.trim()).filter(Boolean) : [];
      $('#plan-card').innerHTML = `
        <div class="kicker">우리 학교 적용 계획</div>
        <h3>${esc(p.title || '(도구 이름)')}</h3>
        <dl>
          <dt>문제</dt><dd>${esc(p.problem || '-')}</dd>
          <dt>사용자</dt><dd>${esc(p.user)}</dd>
          <dt>도구</dt><dd>${esc(p.tool)}</dd>
          <dt>핵심 기능</dt><dd>${feats.length ? `<ul>${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : '-'}</dd>
          <dt>시기</dt><dd>${esc(p.when)}</dd>
          <dt>나눔</dt><dd>${esc(p.share || '-')}</dd>
          <dt>안전 점검</dt><dd>${p.privacy.length}/${P.privacy.length} 완료${p.privacy.length < P.privacy.length ? ' — 남은 항목을 꼭 확인하세요' : ' ✅'}</dd>

      return { p, feats };

    view.addEventListener('input', draw);
    view.addEventListener('change', draw);

      const text = [
        `학교에서 쓸 '${p.title || '수업 도구'}'를 만들고 싶어. 바로 만들지 말고 구현 계획부터 보여 줘.`,
        `- 해결할 문제: ${p.problem || '(작성)'}`,
        `- 사용자: ${p.user}`,
        `- 핵심 기능:`,
        ...(feats.length ? feats.map(f => `  · ${f}`) : ['  · (작성)']),
        `- 사용 시기: ${p.when}`,
        `- 지킬 것: 개인정보는 저장하지 않거나 최소한만, API 키는 코드에 넣지 않기, 초보 교사도 이해하게 한국어로 설명하기`
      ].join('\n');
      copyText(text, '요청문');
    });
  }

  /* ── SHARE (1~2차시와 같은 게시판) ── */
  const TOOLS = ['AI Studio', 'Antigravity', 'Gemini Canvas', 'Apps Script', 'AppSheet', '기타'];
  let shareItems = [], shareFilter = '전체', shareQuery = '', shareTimer = null;

  function renderShare() {
    $('#view-share').innerHTML = `
      <div class="section-head" style="margin-top:4px"><h2 style="font-size:26px">함께 공유</h2><p>AI 스튜디오 · 안티그래비티로 만든 작품을 올리고 서로 둘러봅니다. (1~2차시 게시판과 같은 곳에 모입니다)</p></div>
      <div class="share-layout">
        <div class="card pad">
          <h3 style="font-size:17px;margin-bottom:14px">내 작품 올리기</h3>
          <form id="share-form" novalidate>
            <div class="form-field"><label for="sf-name">이름 (소속)</label><input id="sf-name" maxlength="40" placeholder="예: 홍길동 (○○초)"></div>
            <div class="form-field"><label for="sf-title">앱 이름</label><input id="sf-title" maxlength="60" placeholder="예: 분수 피자 가게"></div>
            <div class="form-field"><label for="sf-tool">만든 도구</label><select id="sf-tool">${TOOLS.map(t => `<option>${esc(t)}</option>`).join('')}</select></div>
            <div class="form-field"><label for="sf-url">링크</label><input id="sf-url" type="url" maxlength="500" placeholder="https://aistudio.google.com/apps/…  또는 배포한 주소"></div>
            <div class="form-field"><label for="sf-desc">한 줄 소개 (선택)</label><textarea id="sf-desc" maxlength="300" placeholder="어떤 수업 · 업무에 쓰는 앱인가요?"></textarea></div>
            <button class="btn primary" type="submit" id="sf-submit" style="width:100%;justify-content:center">공유하기</button>
            <div class="form-msg" id="sf-msg"></div>
          </form>
          <div class="callout warn" style="margin-top:6px;font-size:14px"><span class="ci">✔</span><span>올리기 전 확인: AI 스튜디오 앱은 <b>공유(Share)</b> 설정을 했는지, <code>localhost</code> 주소가 아닌지, 개인정보가 보이지 않는지</span></div>
        </div>
        <div>
          <div class="share-tools">
            <div class="chips" id="share-chips">${['전체'].concat(TOOLS).map(t => `<button class="chip ${t === shareFilter ? 'active' : ''}" data-tool="${esc(t)}">${esc(t)}</button>`).join('')}</div>
            <input class="search" id="share-search" placeholder="앱 이름 · 이름 검색" value="${esc(shareQuery)}">
            <button class="btn sm" id="share-refresh">새로고침</button>
          </div>
          <div class="grid g2" id="share-list"><div class="card empty" style="grid-column:1/-1">불러오는 중…</div></div>
        </div>
      </div>`;

    const nm = store.get('gas-share-name', '');
    if (nm) $('#sf-name').value = nm;
    $('#share-form').addEventListener('submit', submitShare);
    $('#share-chips').addEventListener('click', e => {
      const b = e.target.closest('[data-tool]');
      if (!b) return;
      shareFilter = b.dataset.tool;
      document.querySelectorAll('#share-chips .chip').forEach(c => c.classList.toggle('active', c === b));
      drawShares();
    });
    $('#share-search').addEventListener('input', e => { shareQuery = e.target.value; drawShares(); });
    $('#share-refresh').addEventListener('click', loadShares);
    loadShares();
  }

  async function loadShares() {
    try {
      const res = await fetch(SHARE_API_URL);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '목록 오류');
      shareItems = data.items || [];
      drawShares();
    } catch (err) {
      const list = $('#share-list');
      if (list) list.innerHTML = `<div class="card empty" style="grid-column:1/-1">목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.<br><small>${esc(err.message)}</small></div>`;
    }
  }

  function timeAgo(iso) {
    const t = new Date(iso).getTime();
    if (!t) return '';
    const m = Math.floor((Date.now() - t) / 60000);
    if (m < 1) return '방금';
    if (m < 60) return m + '분 전';
    if (m < 1440) return Math.floor(m / 60) + '시간 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }

  function drawShares() {
    const list = $('#share-list');
    if (!list) return;
    const q = shareQuery.trim().toLowerCase();
    const items = shareItems.filter(it =>
      (shareFilter === '전체' || it.tool === shareFilter) &&
      (!q || (it.title + ' ' + it.name + ' ' + it.description).toLowerCase().includes(q)));
    if (!items.length) {
      list.innerHTML = `<div class="card empty" style="grid-column:1/-1">${shareItems.length ? '조건에 맞는 작품이 없습니다.' : '아직 올라온 작품이 없습니다. 첫 번째로 공유해 보세요!'}</div>`;
      return;
    }
    list.innerHTML = '';
    items.forEach(it => {
      const card = document.createElement('div');
      card.className = 'card share-card';
      const safeUrl = /^https:\/\//i.test(it.url) ? it.url : '';
      card.innerHTML = `
        <div class="who"><span class="badge b-blue"></span><span class="n"></span><span class="t"></span></div>
        <h4></h4><p></p>
        ${safeUrl ? `<a class="btn sm" target="_blank" rel="noopener noreferrer">열어 보기 ↗</a>` : ''}`;
      card.querySelector('.badge').textContent = it.tool;
      card.querySelector('.n').textContent = it.name;
      card.querySelector('.t').textContent = timeAgo(it.createdAt);
      card.querySelector('h4').textContent = it.title;
      card.querySelector('p').textContent = it.description || '';
      if (safeUrl) card.querySelector('a').href = safeUrl;
      list.appendChild(card);
    });
  }

  async function submitShare(e) {
    e.preventDefault();
    const msg = $('#sf-msg');
    const btn = $('#sf-submit');
    const payload = {
      name: $('#sf-name').value.trim(), title: $('#sf-title').value.trim(), tool: $('#sf-tool').value,
      url: $('#sf-url').value.trim(), description: $('#sf-desc').value.trim()
    };
    msg.className = 'form-msg err';
    if (!payload.name || !payload.title || !payload.url) { msg.textContent = '이름, 앱 이름, 링크를 입력해 주세요.'; return; }
    if (!/^https:\/\/\S+$/i.test(payload.url)) { msg.textContent = '링크는 https:// 로 시작해야 합니다.'; return; }
    if (/localhost|127\.0\.0\.1/i.test(payload.url)) { msg.textContent = 'localhost 주소는 내 PC에서만 열립니다. 공유 링크나 배포 주소를 넣어 주세요.'; return; }

    btn.disabled = true;
    btn.textContent = '올리는 중…';
    try {
      // text/plain으로 보내면 Apps Script 웹앱과 CORS 사전 요청 없이 통신할 수 있음
      const res = await fetch(SHARE_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '등록 실패');
      msg.className = 'form-msg ok';
      msg.textContent = '공유되었습니다. 고맙습니다!';
      ['sf-title', 'sf-url', 'sf-desc'].forEach(id => { $('#' + id).value = ''; });
      store.set('gas-share-name', payload.name);
      loadShares();
    } catch (err) {
      msg.textContent = '등록하지 못했습니다: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '공유하기';
    }
  }

  /* ── ROUTER ── */
  const rendered = {};
  function route() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, '')) || 'home';
    const [view, sub] = raw.split('/');
    const known = ['home', 'studio', 'agy', 'compare', 'plan', 'share'];
    const v = known.includes(view) ? view : 'home';

    document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
    document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('active', a.dataset.view === v));

    if (v === 'studio' || v === 'agy') {
      // 두 실습실은 같은 id(pb-make 등)를 쓸 수 있으므로 다른 실습실 화면은 비움
      $('#view-' + (v === 'studio' ? 'agy' : 'studio')).innerHTML = '';
      renderRoom(v, sub);
      window.scrollTo(0, 0);
    } else {
      if (!rendered[v]) {
        ({ home: renderHome, compare: renderCompare, plan: renderPlan, share: renderShare })[v]();
        rendered[v] = v !== 'share';
      }
      window.scrollTo(0, 0);
    }

    clearInterval(shareTimer);
    if (v === 'share') shareTimer = setInterval(loadShares, 30000);
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
